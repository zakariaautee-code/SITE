name: Daily Listings Update
on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC every day
  workflow_dispatch:     # allow manual trigger

permissions:
  contents: write

concurrency:
  group: listings-update
  cancel-in-progress: true

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run scraper
        run: |
          python scripts/scraper.py

      - name: Commit updated listings (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/listings.json
          if git diff --staged --quiet; then
            echo "No changes to listings.json — skipping commit."
          else
            git commit -m "chore: update listings.json (auto daily scrape)
═══════════════════════════════════════════════════════════
🤖 Generated with Codebuff · Senior Full-Stack Engineer
═══════════════════════════════════════════════════════════
Date: $(date -u)
Listings updated: $(python -c "import json; print(len(json.load(open('src/data/listings.json'))))")
"
            git push
          fi

      - name: Trigger Cloudflare Pages rebuild
        # Option A — if deployed on Cloudflare Pages with GitHub integration,
        # pushing to the repo will auto-trigger a new build. No extra step required.
        #
        # Option B — if you use the Cloudflare Pages API directly:
        #   - name: Trigger Cloudflare Pages build
        #     run: |
        #       curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT/builds" \
        #         -H "Authorization: Bearer $CF_API_TOKEN" \
        #         -H "Content-Type: application/json" \
        #         -d '{"branch":"main"}'
        run: |
          echo "Commit pushed — Cloudflare Pages auto-rebuild should start now."
          echo "If not, verify GitHub → Cloudflare Pages integration is enabled."
